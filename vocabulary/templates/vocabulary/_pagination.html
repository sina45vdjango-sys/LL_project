{% if words.has_other_pages %}
<nav class="pagination" aria-label="صفحه‌بندی واژه‌ها">
  {% if words.has_previous %}
    <a href="?page={{ words.previous_page_number }}" aria-label="صفحهٔ قبل">→</a>
  {% endif %}
  <span>صفحهٔ {{ words.number }} از {{ words.paginator.num_pages }}</span>
  {% if words.has_next %}
    <a href="?page={{ words.next_page_number }}" aria-label="صفحهٔ بعد">←</a>
  {% endif %}
</nav>
{% endif %}
