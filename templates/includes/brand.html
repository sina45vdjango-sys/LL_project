{# Wordmark + Concept 3 monogram. Sizing/styling lives in static/css/shell.css. #}
{# All text comes from settings.BRAND, so renaming the product needs no template edit. #}
<a class="brand" href="{{ home_url }}" aria-label="{{ brand.name }} — {{ brand.tagline }}">
  <span class="brand__mark" aria-hidden="true">
    <svg viewBox="0 0 32 32" focusable="false">
      <path d="M9.5 24.4C9.5 16.7 22.5 19.1 22.5 8.6" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round"/>
      <circle cx="9.5" cy="24.4" r="2.9" fill="currentColor" opacity=".45"/>
      <circle cx="22.5" cy="8.6" r="3.9" fill="currentColor"/>
    </svg>
  </span>
  <span class="brand__text">
    <span class="brand__word"><b>{{ brand.name }}</b></span>
    <small class="brand__latin" lang="en" dir="ltr">{{ brand.latin }}</small>
  </span>
</a>
