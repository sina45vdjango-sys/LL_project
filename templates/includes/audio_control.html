{% comment %}One audio control for every playable item in the product: lesson prose blocks,
   grammar topics, sentences, vocabulary words and exercise question audio.

   Lightweight trigger element for the Audio Singleton (static/js/audio.js). Instead of
   rendering dozens of redundant <audio> elements in the DOM, each control carries its
   source on `data-audio-src`. The global Audio Singleton manages playback, play/stop
   states, and only attaches the native scrubber for clips >= 5s.

   The button ships `hidden` and the script reveals it: with JavaScript off there is
   no button that would do nothing, only the plain download link in the <noscript> block.
{% endcomment %}
{% if audio %}<span class="audio-control{% if inline %} audio-control--inline{% endif %}" id="{{ prefix }}-{{ pk }}" data-audio-src="{{ audio.url }}">
  <button type="button" class="audio-toggle" hidden aria-expanded="false" aria-controls="{{ prefix }}-{{ pk }}" aria-label="پخش {{ label }}" data-label="{{ label }}" data-audio-src="{{ audio.url }}">
    <svg class="audio-toggle__play" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-audio-play"/></svg>
    <svg class="audio-toggle__stop" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-audio-stop"/></svg>
  </button>
  <span class="audio-status" role="status" hidden></span>
  <noscript><a class="audio-fallback" href="{{ audio.url }}">دریافت فایل صوتی</a></noscript>
</span>{% endif %}
